media:
  input: media/blog
  output: /media/blog
  rename: safe
  extensions: [jpg, jpeg, png, webp, gif, avif, mp4, webm, pdf, pptx]
content:
  - name: posts
    label: Blog articles
    type: collection
    path: content/blog
    format: json
    filename: "{fields.slug}.json"
    subfolders: false
    view:
      primary: title
      fields: [title, published, date, category]
      sort: date
      order: desc
    fields:
      - name: title
        label: Article title
        type: string
        required: true
      - name: slug
        label: Page address
        type: string
        required: true
        description: "Use lowercase English letters, numbers and hyphens, e.g. arterial-lines. The page will be /blog/arterial-lines/. Keep this unchanged after publishing."
      - name: published
        label: Publish on website
        type: boolean
        default: false
        description: "Leave off while writing. Turn on and save to publish. Drafts are excluded from the website, but source files are visible in this public GitHub repository."
      - name: date
        label: Article date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: language
        label: Article language
        type: select
        default: en
        options:
          values:
            - name: en
              label: English
            - name: ru
              label: Русский
      - name: category
        label: Primary topic
        type: reference
        default: Notes
        description: Choose a saved topic. To add a new one, save it in Topics first.
        options:
          collection: topic_library
          search: fields.title
          value: "{primary}"
          label: "{primary}"
      - name: topics
        label: Additional topics
        type: reference
        options:
          collection: topic_library
          multiple: true
          search: fields.title
          value: "{primary}"
          label: "{primary}"
      - name: tags
        label: Tags
        type: string
        list: true
        description: "Add keywords one per item, e.g. echocardiography, heart failure or ultrasound. Readers can click a tag or use the tag filter."
      - name: excerpt
        label: Short introduction
        type: text
        required: true
        description: Appears on the blog overview and below the article title.
      - name: cover
        label: Cover image
        type: image
      - name: cover_alt
        label: Cover image description
        type: string
        description: Describe the image for readers who cannot see it.
      - name: cover_caption
        label: Image caption / credit
        type: string
      - name: attachments
        label: Downloadable attachments
        type: object
        list: true
        description: Add documents to display below the cover image, in the order listed.
        fields:
          - name: file
            label: PDF or PowerPoint file
            type: file
            required: true
            options:
              extensions: [pdf, pptx]
              rename: safe
          - name: title
            label: Download label (optional)
            type: string
            description: Leave blank to use the filename.
      - name: body
        label: Article
        type: rich-text
        options:
          format: html
        description: "Heading 1 is large and centered; Heading 2 is smaller and left-aligned. Headings 1–3 appear in the contents menu. For colored words, use the palette at https://tamerlanerdniev.ru/blog/edit/#palette. Insert images and links using the toolbar."
      - name: sections
        label: Additional sections & videos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        description: Add and reorder sections for more text, pictures or a video at any point after the main article.
        fields:
          - name: title
            label: Section heading
            type: string
          - name: body
            label: Text & pictures
            type: rich-text
            options:
              format: html
          - name: video_url
            label: Video link
            type: string
            description: Paste a YouTube, Vimeo, or direct .mp4/.webm URL. Other video links display as a Watch video button.
          - name: video_caption
            label: Video caption / credit
            type: string
          - name: video_file
            label: Or upload a short video
            type: file
            options:
              extensions: [mp4, webm]
              rename: safe
            description: "Optional MP4/WebM clip. For large videos, use a YouTube or Vimeo link instead. If both are filled in, the video link is used."
      - name: references
        label: References & useful links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: title
            label: Reference title
            type: string
            required: true
          - name: url
            label: Link
            type: string
            required: true
  - name: topic_library
    label: Topics
    type: collection
    path: content/topics
    format: json
    view:
      primary: title
    fields:
      - name: title
        label: Topic name
        type: string
        required: true
