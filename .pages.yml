media:
  input: media/blog
  output: /media/blog
  rename: safe
  extensions: [jpg, jpeg, png, webp, gif, avif, mp4, webm, pdf, pptx]
content:
  - name: posts
    label: Blog articles
    type: collection
    path: content/blog
    format: json
    filename: "{fields.slug}.json"
    subfolders: false
    view:
      primary: title
      fields: [title, language, published, date, category]
      sort: date
      order: desc
    fields:
      - name: title
        label: Article title
        type: string
        required: true
      - name: slug
        label: Page address
        type: string
        required: true
        description: "Use lowercase English letters, numbers and hyphens, e.g. arterial-lines. The page will be /blog/arterial-lines/. Keep this unchanged after publishing."
      - name: published
        label: Publish on website
        type: boolean
        default: false
        description: "Leave off while writing. Turn on and save to publish. Drafts are excluded from the website, but source files are visible in this public GitHub repository."
      - name: date
        label: Article date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: language
        label: Article language
        type: select
        default: en
        options:
          values:
            - name: en
              label: English
            - name: ru
              label: Русский
      - name: category
        label: Primary topic
        type: reference
        description: Choose an existing topic, or leave blank to use the first New topic below.
        options:
          collection: topic_library
          search: fields.title
          value: "{primary}"
          label: "{primary}"
      - name: topics
        label: Existing topics
        type: reference
        options:
          collection: topic_library
          multiple: true
          search: fields.title
          value: "{primary}"
          label: "{primary}"
      - name: new_topics
        label: New topics
        type: string
        list: true
        description: "Type new topics here, one per item. Save the article (drafts work too) and they will become suggestions for future articles after a short delay. Refresh the editor after saving to see the updated suggestions."
      - name: tags
        label: Tags
        type: string
        list: true
        description: "Add keywords one per item, e.g. echocardiography, heart failure or ultrasound. Readers can click a tag or use the tag filter."
      - name: excerpt
        label: Short introduction
        type: rich-text
        options:
          format: html
          media: false
        required: true
        description: Select words and use the link button to add a URL. Links appear on the blog overview and below the article title.
      - name: cover
        label: Cover image
        type: image
      - name: cover_alt
        label: Cover image description
        type: string
        description: Describe the image for readers who cannot see it.
      - name: cover_caption
        label: Image caption / credit
        type: string
      - name: attachments
        label: Downloadable attachments
        type: object
        list: true
        description: Add documents to display below the cover image, in the order listed.
        fields:
          - name: file
            label: PDF or PowerPoint file
            type: file
            required: true
            options:
              extensions: [pdf, pptx]
              rename: safe
          - name: title
            label: Download label (optional)
            type: string
            description: Leave blank to use the filename.
      - name: body
        label: Article
        type: rich-text
        options:
          format: html
        description: "Heading 1 is large and centered; Heading 2 is smaller and left-aligned. Headings 1–3 appear in the contents menu. For colored words, use the palette at https://tamerlanerdniev.ru/blog/edit/#palette. Insert images and links using the toolbar."
      - name: sections
        label: Additional sections & videos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        description: Add and reorder sections for more text, pictures or a video at any point after the main article.
        fields:
          - name: title
            label: Section heading
            type: string
          - name: body
            label: Text & pictures
            type: rich-text
            options:
              format: html
          - name: video_url
            label: Video link
            type: string
            description: Paste a YouTube, Vimeo, or direct .mp4/.webm URL. Other video links display as a Watch video button.
          - name: video_caption
            label: Video caption / credit
            type: string
          - name: video_file
            label: Or upload a short video
            type: file
            options:
              extensions: [mp4, webm]
              rename: safe
            description: "Optional MP4/WebM clip. For large videos, use a YouTube or Vimeo link instead. If both are filled in, the video link is used."
      - name: references
        label: References & useful links
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: title
            label: Reference title
            type: string
            required: true
          - name: url
            label: Link
            type: string
            required: true
      - name: translation
        label: Translation (other language)
        type: object
        description: "Write the other language inside this article. English originals get Russian; Russian originals get English. The blog lists this article once."
        fields:
          - name: published
            label: Publish translated version
            type: boolean
            default: false
            description: "Publish after adding the translated title, introduction and body. The main article must also be published."
          - name: title
            label: Translated title
            type: string
          - name: slug
            label: Translated page address (optional)
            type: string
            description: "Optional. Leave blank for an automatic address. Keep an existing translated address unchanged."
          - name: excerpt
            label: Translated introduction
            type: rich-text
            options:
              format: html
              media: false
            description: Select words and use the link button to add a URL. Links appear on the blog overview and below the article title.
          - name: cover
            label: Cover image
            type: image
          - name: cover_alt
            label: Cover image description
            type: string
            description: Describe the image for readers who cannot see it.
          - name: cover_caption
            label: Image caption / credit
            type: string
          - name: attachments
            label: Downloadable attachments
            type: object
            list: true
            description: Add documents to display below the cover image, in the order listed.
            fields:
              - name: file
                label: PDF or PowerPoint file
                type: file
                required: true
                options:
                  extensions: [pdf, pptx]
                  rename: safe
              - name: title
                label: Download label (optional)
                type: string
                description: Leave blank to use the filename.
          - name: body
            label: Translated article
            type: rich-text
            options:
              format: html
            description: "Heading 1 is large and centered; Heading 2 is smaller and left-aligned. Headings 1–3 appear in the contents menu. For colored words, use the palette at https://tamerlanerdniev.ru/blog/edit/#palette. Insert images and links using the toolbar."
          - name: sections
            label: Additional sections & videos
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.title}"
            description: Add and reorder sections for more text, pictures or a video at any point after the main article.
            fields:
              - name: title
                label: Section heading
                type: string
              - name: body
                label: Text & pictures
                type: rich-text
                options:
                  format: html
              - name: video_url
                label: Video link
                type: string
                description: Paste a YouTube, Vimeo, or direct .mp4/.webm URL. Other video links display as a Watch video button.
              - name: video_caption
                label: Video caption / credit
                type: string
              - name: video_file
                label: Or upload a short video
                type: file
                options:
                  extensions: [mp4, webm]
                  rename: safe
                description: "Optional MP4/WebM clip. For large videos, use a YouTube or Vimeo link instead. If both are filled in, the video link is used."
          - name: references
            label: References & useful links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.title}"
            fields:
              - name: title
                label: Reference title
                type: string
                required: true
              - name: url
                label: Link
                type: string
                required: true
  - name: topic_library
    label: Topics
    type: collection
    path: content/topics
    format: json
    view:
      primary: title
    fields:
      - name: title
        label: Topic name
        type: string
        required: true

  - name: drugs
    label: Drugs
    type: collection
    path: content/drugs
    format: json
    filename: "{fields.slug}.json"
    subfolders: false
    view:
      primary: title
      fields: [title, published, categories, reviewed]
      sort: title
      order: asc
    fields:
      - name: title
        label: Drug name
        type: string
        required: true
      - name: slug
        label: Page address
        type: string
        required: true
        description: "Lowercase letters, numbers and hyphens, e.g. norepinephrine. Keep unchanged after publication."
      - name: published
        label: Publish on website
        type: boolean
        default: false
        description: "Drafts are hidden from the website. This GitHub repository is public, so do not enter confidential information."
      - name: aliases
        label: Other names / brand names
        type: string
        list: true
      - name: categories
        label: Categories / folders
        type: string
        list: true
        description: "Type any category directly. Use / for nested folders, e.g. Cardiovascular / Vasopressors. A drug can belong to several folders."
      - name: reviewed
        label: Last clinically reviewed
        type: date
        options:
          format: yyyy-MM-dd
      - name: summary
        label: Brief description
        type: text
      - name: overview
        label: Overview / pharmacologic category
        type: rich-text
        options:
          format: html
      - name: dosing_guidance
        label: General dosing guidance
        type: rich-text
        options:
          format: html
        description: "Include formulation, dose-expression and unit conventions where needed."
      - name: doses
        label: Dosing by condition
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.condition}"
        description: "Add one entry for each indication or population. Reorder entries by dragging."
        fields:
          - name: condition
            label: Condition / indication
            type: string
            required: true
          - name: population
            label: Patient group
            type: string
            description: "For example Adult, Pediatric, Older adult."
          - name: route
            label: Route / formulation
            type: string
          - name: off_label
            label: Off-label use
            type: boolean
            default: false
          - name: body
            label: Doses, titration, maximum dose and notes
            type: rich-text
            options:
              format: html
            description: "Use paragraphs, headings, lists or tables. State units explicitly and add source links."
      - name: renal
        label: Kidney impairment
        type: rich-text
        options:
          format: html
      - name: hepatic
        label: Liver impairment
        type: rich-text
        options:
          format: html
      - name: special_populations
        label: Obesity / older adults / other populations
        type: rich-text
        options:
          format: html
      - name: administration
        label: Administration / preparation / storage
        type: rich-text
        options:
          format: html
      - name: contraindications
        label: Contraindications
        type: rich-text
        options:
          format: html
      - name: warnings
        label: Warnings / precautions
        type: rich-text
        options:
          format: html
      - name: adverse_effects
        label: Adverse effects
        type: rich-text
        options:
          format: html
      - name: interactions
        label: Drug interactions
        type: rich-text
        options:
          format: html
      - name: pregnancy
        label: Pregnancy / breastfeeding
        type: rich-text
        options:
          format: html
      - name: monitoring
        label: Monitoring
        type: rich-text
        options:
          format: html
      - name: mechanism
        label: Mechanism of action
        type: rich-text
        options:
          format: html
      - name: pharmacokinetics
        label: Pharmacokinetics
        type: rich-text
        options:
          format: html
      - name: counseling
        label: Patient counseling
        type: rich-text
        options:
          format: html

      - name: sections
        label: Additional sections
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title}"
        fields:
          - name: title
            label: Heading
            type: string
            required: true
          - name: body
            label: Text, tables and pictures
            type: rich-text
            options:
              format: html
      - name: attachments
        label: Downloadable documents
        type: object
        list: true
        fields:
          - name: title
            label: Download label
            type: string
          - name: file
            label: PDF or PowerPoint
            type: file
            options:
              extensions: [pdf, pptx]
      - name: references
        label: References
        type: object
        list: true
        fields:
          - name: title
            label: Source title
            type: string
          - name: url
            label: Source link
            type: string
